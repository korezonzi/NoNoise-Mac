name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0 or stable-latest"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release target
        id: release_target
        run: |
          # --force: CI's checkout already holds the pushed tag, and an un-forced --tags refuses to
          # re-fetch it ("would clobber existing tag"), which broke the 2nd versioned release. Forcing
          # also guarantees we get the ANNOTATED tag object so the release notes extract correctly.
          git fetch --force origin main --tags

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IS_STABLE=true
            git checkout "${{ github.event.workflow_run.head_sha }}"
            TAG="main-$(git rev-parse --short=12 HEAD)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ "$TAG" = "stable-latest" ]; then
              IS_STABLE=true
              git checkout origin/main
              TAG="main-$(git rev-parse --short=12 HEAD)"
            else
              IS_STABLE=false
              git fetch --force --tags origin "$TAG"
              git checkout "$TAG"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            IS_STABLE=false
          fi

          if [ "$IS_STABLE" != "true" ] && ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.0.0, v1.0, or v1.0.0-beta.1" >&2
            exit 1
          fi

          if ! git branch -r --contains HEAD | grep -q 'origin/main'; then
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Show Swift version
        run: swift --version

      - name: Test updater version helper
        run: ./scripts/version-from-tag.test.sh

      - name: Test
        run: swift test

      - name: Build release binaries
        run: swift build -c release --arch arm64

      - name: Bundle app, CLI, and driver
        run: ./bundle.sh --with-driver

      - name: Prepare release assets
        run: |
          TAG="${{ steps.release_target.outputs.tag }}"
          IS_STABLE="${{ steps.release_target.outputs.is_stable }}"
          TARGET_SHA="${{ steps.release_target.outputs.target_sha }}"
          mkdir -p release-assets
          if [ "$IS_STABLE" = "true" ]; then
            ditto -c -k --keepParent NoNoiseMac.app "release-assets/NoNoiseMac.app.zip"
            cp NoNoiseMacCLI "release-assets/NoNoiseMacCLI"
            ditto -c -k --keepParent NoNoiseMic.driver "release-assets/NoNoiseMic.driver.zip"
            # One-click installer (app + driver). Unsigned until PKG_SIGN_IDENTITY is set in CI.
            ./build-pkg.sh --output "release-assets/NoNoiseMac.pkg"
            shasum -a 256 release-assets/* > "release-assets/SHA256SUMS.txt"
          else
            ditto -c -k --keepParent NoNoiseMac.app "release-assets/NoNoiseMac-${TAG}.app.zip"
            ditto -c -k --keepParent NoNoiseMacCLI "release-assets/NoNoiseMacCLI-${TAG}.zip"
            ditto -c -k --keepParent NoNoiseMic.driver "release-assets/NoNoiseMic-driver-${TAG}.zip"
            # One-click installer (app + driver). Unsigned until PKG_SIGN_IDENTITY is set in CI.
            ./build-pkg.sh --output "release-assets/NoNoiseMac-${TAG}.pkg"
            # Un-suffixed copy so the fixed link …/releases/latest/download/NoNoiseMac.pkg always
            # resolves to the newest installer (the team guide links only that URL).
            cp "release-assets/NoNoiseMac-${TAG}.pkg" "release-assets/NoNoiseMac.pkg"
            shasum -a 256 release-assets/* > "release-assets/SHA256SUMS-${TAG}.txt"
          fi

      - name: Prepare release notes
        run: |
          TAG="${{ steps.release_target.outputs.tag }}"
          IS_STABLE="${{ steps.release_target.outputs.is_stable }}"
          if [ "$IS_STABLE" != "true" ]; then
            # Force-fetch the ANNOTATED tag object into refs/tags so its body is readable even on a
            # workflow_dispatch retry — checkout can leave the tag peeled/lightweight, which silently
            # yields the commit body (empty) -> fallback notes. This shipped once: v1.3.0 first
            # published with the default footer instead of the tag's release notes.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > /tmp/release-notes.md

            if grep -q '[^[:space:]]' /tmp/release-notes.md; then
              # Append standard install footer
              printf '\n---\n\n%s\n' "> **Apple Silicon only, unsigned build.** macOS blocks the first open (right-click → Open no longer works on macOS 15+): open **System Settings → Privacy & Security**, click **Open Anyway**, then run the installer again. Team guide (JA): https://github.com/korezonzi/NoNoise-Mac/blob/main/docs/deploy/team-install.md" >> /tmp/release-notes.md
            else
              # Lightweight tag or empty message — minimal fallback
              printf 'Apple Silicon build of NoNoise Mac.\n\n%s\n' "> **Apple Silicon only, unsigned build.** macOS blocks the first open (right-click → Open no longer works on macOS 15+): open **System Settings → Privacy & Security**, click **Open Anyway**, then run the installer again. Team guide (JA): https://github.com/korezonzi/NoNoise-Mac/blob/main/docs/deploy/team-install.md" > /tmp/release-notes.md
            fi
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_target.outputs.tag }}"
          IS_STABLE="${{ steps.release_target.outputs.is_stable }}"
          TARGET_SHA="${{ steps.release_target.outputs.target_sha }}"

          if [ "$IS_STABLE" = "true" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" \
                --title "NoNoise Mac stable" \
                --notes "Latest successful Apple Silicon build from main (unsigned: first open needs System Settings → Privacy & Security → Open Anyway)." \
                --latest
            else
              gh release create "$TAG" \
                --title "NoNoise Mac stable" \
                --notes "Latest successful Apple Silicon build from main (unsigned: first open needs System Settings → Privacy & Security → Open Anyway)." \
                --target "$TARGET_SHA" \
                --latest
            fi

            gh release upload "$TAG" release-assets/* --clobber
          else
            # Idempotent: re-running a versioned release (e.g. workflow_dispatch retry) must update
            # the existing release, not fail with "release already exists".
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release-assets/* --clobber
              gh release edit "$TAG" --title "NoNoise Mac $TAG" --notes-file /tmp/release-notes.md
            else
              gh release create "$TAG" release-assets/* \
                --title "NoNoise Mac $TAG" \
                --notes-file /tmp/release-notes.md
            fi
          fi
